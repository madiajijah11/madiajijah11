<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 20" width="100%" height="20">
  <defs>
    <linearGradient id="cyberDivider" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0" />
      <stop offset="20%" stop-color="#00ff88" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="80%" stop-color="#7000ff" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0" />
    </linearGradient>

    <filter id="cyberGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Track -->
  <line x1="10" y1="10" x2="810" y2="10" stroke="url(#cyberDivider)" stroke-width="1.6" filter="url(#cyberGlow)"/>

  <!-- Circuit Dots -->
  <circle cx="210" cy="10" r="3" fill="#00ff88" />
  <circle cx="410" cy="10" r="4.5" fill="#00f0ff" filter="url(#cyberGlow)" />
  <circle cx="610" cy="10" r="3" fill="#a855f7" />

  <!-- Animated Data Packet -->
  <circle cx="20" cy="10" r="4" fill="#00ff88" filter="url(#cyberGlow)">
    <animate attributeName="cx" values="10;810;10" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite" />
  </circle>
</svg>
